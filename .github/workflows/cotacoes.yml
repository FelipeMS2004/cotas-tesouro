name: Cotações Tesouro

# Acionado pelo cron-job.org às 10h, 12h e 15h (horário exato).
# O botão "Run workflow" continua funcionando para testes (grava como "manual").
on:
  workflow_dispatch:
    inputs:
      agendado:
        description: "sim = captura agendada (10h/12h/15h) | nao = teste manual"
        default: "nao"

permissions:
  contents: write

concurrency:
  group: cotacoes

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q curl_cffi requests
      - name: Capturar cotações
        env:
          EVENTO: ${{ inputs.agendado == 'sim' && 'schedule' || github.event_name }}
        run: python capturar.py
      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotacoes.csv || exit 0
          git commit -m "Cotações $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
