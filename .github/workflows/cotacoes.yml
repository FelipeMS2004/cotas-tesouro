name: Cotações Tesouro

on:
  schedule:
    - cron: "0 13,15,18 * * 1-5"   # 10h, 12h e 15h de Brasília (UTC-3), seg a sex
  workflow_dispatch:                # botão "Run workflow" para testar na hora

permissions:
  contents: write

concurrency:
  group: cotacoes

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q curl_cffi requests
      - name: Capturar cotações
        env:
          EVENTO: ${{ github.event_name }}
        run: python capturar.py
      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotacoes.csv || exit 0
          git commit -m "Cotações $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" || exit 0
          git pull --rebase
          git push
